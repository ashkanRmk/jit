# XcodeGen spec — the source of truth for macos/Jit.xcodeproj (generated, git-ignored; ADR-0003).
# Regenerate with scripts/build/gen-xcodeproj.sh.
name: Jit
options:
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: App/Config/Debug.xcconfig
  Release: App/Config/Release.xcconfig
packages:
  JitKit:
    path: Packages/JitKit
targets:
  # The credential helper / askpass / ssh wrapper (ADR-0016), built from the package sources and embedded at
  # Contents/Helpers/jit-git-helper. Foundation/Darwin only.
  jit-git-helper:
    type: tool
    platform: macOS
    sources:
      - path: Packages/JitKit/Sources/JitGitHelper
    settings:
      base:
        PRODUCT_NAME: jit-git-helper
        SWIFT_VERSION: "6.0"
        SKIP_INSTALL: YES
  Jit:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes: ["Config/**"]
    dependencies:
      - target: jit-git-helper
        copy:
          destination: wrapper
          subpath: Contents/Helpers
        codeSign: true
      - package: JitKit
        product: GitCore
      - package: JitKit
        product: DesignSystem
      - package: JitKit
        product: Services
      - package: JitKit
        product: Features
    settings:
      base:
        PRODUCT_NAME: Jit
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Jit
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        # Layered Liquid Glass icon authored as an Icon Composer document (App/AppIcon.icon, P7.5).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_NSHumanReadableCopyright: "$(JIT_COPYRIGHT)"
  JitAppTests:
    type: bundle.unit-test
    platform: macOS
    sources: [AppTests]
    dependencies:
      - package: JitKit
        product: Features
      - package: JitKit
        product: Services
      - package: JitKit
        product: GitCore
      - package: JitKit
        product: GitTestKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.ashkanrmk.jit.tests
schemes:
  Jit:
    build:
      targets:
        Jit: all
        JitAppTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [JitAppTests]
    profile:
      config: Release
    archive:
      config: Release
