name: CI

on:
  push:
    branches: [main, "phase/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # `runner.temp` is not available in job-level `env`, so export it from a step.
      - name: Configure DerivedData location
        run: echo "JIT_DERIVED_DATA=$RUNNER_TEMP/DerivedData" >> "$GITHUB_ENV"

      - name: Select Xcode 26 or newer
        run: |
          set -euo pipefail
          candidate=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1 || true)
          [[ -n "$candidate" ]] || { echo "::error::No Xcode installed on this runner"; exit 1; }
          sudo xcode-select -s "$candidate/Contents/Developer"
          xcodebuild -version
          major=$(xcodebuild -version | awk 'NR==1 {split($2, v, "."); print v[1]}')
          [[ "$major" -ge 26 ]] || { echo "::error::Xcode $major found; Jit needs Xcode 26+"; exit 1; }
          git --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Lint
        run: scripts/build/lint.sh

      - name: Core tests (swift test)
        # Latency assertions get 4x headroom on the shared runner (GitTestKit.TimingBudget).
        # Serial on the shared runner: parallel suites starved the few vCPUs and timed out waits (Phase 7).
        env:
          JIT_TEST_TIMING_SCALE: "4"
          JIT_TEST_SERIAL: "1"
        run: scripts/build/test-core.sh

      - name: Build app (debug)
        run: scripts/build/build-all.sh debug

      - name: App tests (xcodebuild test)
        run: scripts/build/test-app.sh

      - name: Build app (release)
        run: scripts/build/build-app.sh release

  # Advisory performance gate (ADR-0041): release micro-benchmarks on a shared runner, compared with the
  # reference baseline using loose thresholds (2.5×). The reference-Mac run (run-all.sh) is the authority.
  performance:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26 or newer
        run: |
          set -euo pipefail
          candidate=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1 || true)
          [[ -n "$candidate" ]] || { echo "::error::No Xcode installed on this runner"; exit 1; }
          sudo xcode-select -s "$candidate/Contents/Developer"
      - name: Benchmark tooling tests
        run: python3 -m unittest discover -s scripts/benchmarks/tests
      - name: Micro-benchmarks (release) and loose regression check
        env:
          JIT_BENCH_DIR: ${{ runner.temp }}/jit-bench
        run: scripts/benchmarks/run-all.sh --ci
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmarks/results/
