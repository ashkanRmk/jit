name: Pages

# Publishes site/ to GitHub Pages. Re-runs when a release is published so the
# download button always points at the newest DMG.
on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  release:
    types: [published, edited, deleted]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # The newest published release, pre-releases included (releases/latest skips them).
      # Without a release that has a DMG the page keeps linking to the releases list.
      - name: Resolve the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=20" --jq '
            [ .[] | select(.draft | not)
              | . as $r | ($r.assets[] | select(.name | endswith(".dmg"))) as $a
              | { tag: $r.tag_name,
                  version: ($r.tag_name | ltrimstr("v")),
                  url: $a.browser_download_url,
                  size: $a.size,
                  published: $r.published_at } ]
            | sort_by(.published) | last // empty' > site/release.json
          if [[ -s site/release.json ]]; then cat site/release.json; else rm site/release.json; echo "No release with a DMG yet"; fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
